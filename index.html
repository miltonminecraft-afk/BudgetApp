<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1116">
<title>Budget</title>
<style>
:root{--bg:#0f1116;--card:#171a21;--card2:#20252e;--line:#2c323d;--txt:#f7f9fc;--muted:#9ca6b5;--green:#67d68d;--blue:#8cadff;--yellow:#f0c85d;--red:#ff7777;--r:19px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{width:min(100%,480px);margin:auto;padding:0 14px 94px;min-height:100vh}.top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:14px;background:rgba(15,17,22,.94);backdrop-filter:blur(16px);display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:850}.sub{font-size:11px;color:var(--muted);margin-top:2px}.gear{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--txt)}.card{background:linear-gradient(150deg,var(--card),#13161b);border:1px solid var(--line);border-radius:var(--r)}.section{margin-top:14px}.balance{padding:18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.big{font-size:38px;font-weight:900;letter-spacing:-.04em;margin-top:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.mini{padding:12px;border-radius:15px;background:var(--card2);border:1px solid var(--line)}.mini small{display:block;color:var(--muted);font-size:11px}.mini strong{display:block;margin-top:4px;font-size:18px}.pos{color:var(--green)}.neg{color:#ff9393}.goal{padding:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:16px;font-weight:850}.link{border:0;background:none;color:var(--blue);font-weight:750;font-size:12px}.bar{height:11px;background:#0d1015;border:1px solid #2a3039;border-radius:99px;overflow:hidden;margin-top:12px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#a4efbd)}.goalfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}.goalestimate{margin-top:10px;padding:9px 11px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}.goalestimate strong{color:var(--txt);font-size:12px}.period{display:inline-flex;align-items:center;margin-left:6px;padding:3px 6px;border-radius:999px;background:#242b36;color:#b8c5dc;font-size:9px;font-weight:850;vertical-align:1px}.salaryperiod{margin-top:8px;padding-top:8px;border-top:1px solid rgba(156,166,181,.14);font-size:9px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}.salaryperiod strong{color:#d7deea;font-size:9px}.periodbanner{margin:0 0 10px;padding:10px 12px;border-radius:14px;background:#151922;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.periodbanner span{font-size:10px;color:var(--muted)}.periodbanner strong{font-size:11px;color:var(--txt)}.pot.wide{grid-column:1/-1;min-height:114px}.cta{width:100%;border:0;border-radius:18px;padding:16px;background:linear-gradient(135deg,#76dd97,#56c87a);color:#07120a;text-align:left;font-weight:900;font-size:16px}.cta small{display:block;font-size:11px;opacity:.72;margin-top:2px}.head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}.pots{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pot{padding:14px;min-height:126px;display:flex;flex-direction:column;justify-content:space-between}.potname{font-size:12px;color:var(--muted)}.left{font-size:22px;font-weight:880;margin-top:3px}.meter{height:6px;background:#101318;border-radius:99px;overflow:hidden;margin-top:8px}.meter span{display:block;height:100%;background:var(--blue)}.meta{font-size:10px;color:var(--muted)}.alert{padding:14px;display:flex;gap:10px;align-items:center;border-color:#5a4d24;background:linear-gradient(150deg,#201b10,#15181e)}.dot{width:10px;height:10px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 5px rgba(240,200,93,.13)}.grow{flex:1}.alert strong{font-size:13px}.alert small{display:block;color:var(--muted);margin-top:2px}.badge{padding:5px 8px;border-radius:99px;background:#302916;color:#f3d46f;font-size:11px;font-weight:800}.txlist{overflow:hidden}.tx{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:13px 14px;border-top:1px solid var(--line)}.tx:first-child{border-top:0}.txicon{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:900;color:var(--blue)}.txname{font-size:13px;font-weight:800}.txsub{font-size:10px;color:var(--muted);margin-top:2px}.txamt{font-size:13px;font-weight:850;text-align:right}.unknown{background:linear-gradient(90deg,rgba(240,200,93,.06),transparent)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--txt);padding:13px 7px;font-weight:750;font-size:11px}.quick b{display:block;font-size:18px;margin-bottom:5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:rgba(15,17,22,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:5px;z-index:50}.nav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:8px 4px;font-size:10px;font-weight:750}.nav button.active{background:var(--card);color:var(--txt)}.nav b{display:block;font-size:18px;margin-bottom:3px}.screen{display:none}.screen.active{display:block}.list{overflow:hidden}.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line)}.setrow:first-child{border-top:0}.setrow strong{font-size:13px}.setrow small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.value{font-weight:850;color:var(--blue);font-size:13px}.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:100}.modalbg.open{display:flex}.modal{width:min(100%,470px);max-height:88vh;overflow:auto;background:#171a21;border:1px solid var(--line);border-radius:24px;padding:17px}.handle{width:45px;height:5px;border-radius:99px;background:#3b424e;margin:0 auto 13px}.close{width:36px;height:36px;border:0;border-radius:11px;background:var(--card2);color:var(--txt)}.field{margin-top:13px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:750;margin-bottom:6px}.input,.select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:#101318;color:var(--txt);outline:none}.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cat{padding:11px;border-radius:13px;border:1px solid var(--line);background:var(--card2);color:var(--txt);text-align:left;font-weight:750;font-size:12px}.cat.on{border-color:#5ccf82;background:#16311f;color:#b9f4cc}.primary{width:100%;border:0;border-radius:14px;padding:13px;background:var(--green);color:#08120b;font-weight:900;margin-top:14px}.result{display:none;margin-top:14px;padding:13px;border-radius:15px;border:1px solid var(--line);background:var(--card2)}.result.show{display:block}.result.ok{border-color:#386c49;background:#14271a}.result.warn{border-color:#6c5b2b;background:#292313}.result.no{border-color:#6d3838;background:#291717}.result strong{font-size:13px}.result small{display:block;color:var(--muted);line-height:1.45;margin-top:3px}.detail{margin-top:10px}.drow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:12px}.drow:first-child{border-top:0}.drow span:first-child{color:var(--muted)}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{padding:5px 7px;border-radius:99px;background:var(--card2);color:#c8d0da;font-size:10px}.ghost{width:100%;padding:11px;border-radius:13px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-weight:750;margin-top:8px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(15px);width:min(calc(100% - 28px),450px);padding:12px 14px;border-radius:15px;background:#222832;border:1px solid #333b47;opacity:0;pointer-events:none;transition:.2s;z-index:130}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast strong{font-size:12px}.toast small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.empty{padding:18px 14px;color:var(--muted);font-size:12px}.danger{color:var(--red)}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">Budget</div><div class="sub">Lokaal financieel overzicht</div></div><button class="gear" onclick="openSettings()">⚙</button></header>
<section id="home" class="screen active"></section>
<section id="budgets" class="screen"></section>
<section id="transactions" class="screen"></section>
<section id="overview" class="screen"></section>
</div>
<nav class="nav">
<button id="nhome" class="active" onclick="showScreen('home','nhome')"><b>⌂</b>Home</button>
<button id="nbudget" onclick="showScreen('budgets','nbudget')"><b>▣</b>Budget</button>
<button id="ntx" onclick="showScreen('transactions','ntx')"><b>≡</b>Transacties</button>
<button id="nover" onclick="showScreen('overview','nover')"><b>▥</b>Overzicht</button>
</nav>
<div id="sheet" class="modalbg"><div class="modal"><div class="handle"></div><div class="row"><div class="title" id="sheetTitle"></div><button class="close" onclick="closeSheet()">✕</button></div><div id="sheetBody"></div></div></div>
<div id="toast" class="toast"><strong id="toasttitle"></strong><small id="toasttext"></small></div>
<script>
const STORAGE_KEY='budgetAppStateV2';
const seed=()=>({pots:[{id:id(),name:'Vrije uitgaven',budget:80,period:'week',active:true},{id:id(),name:'Boodschappen',budget:180,period:'salary',active:true},{id:id(),name:'Brandstof',budget:60,period:'salary',active:true}],transactions:[],fixedCosts:[],goal:{name:'Spaardoel',current:0,target:30000,monthly:0},knownBalance:null,rules:{}});
const platform={
 load(){try{if(window.BudgetAppAndroid&&typeof window.BudgetAppAndroid.loadState==='function'){const v=window.BudgetAppAndroid.loadState();if(v)return JSON.parse(v)}const v=localStorage.getItem(STORAGE_KEY);return v?JSON.parse(v):null}catch{return null}},
 save(value){const json=JSON.stringify(value);try{if(window.BudgetAppAndroid&&typeof window.BudgetAppAndroid.saveState==='function'){window.BudgetAppAndroid.saveState(json);return}localStorage.setItem(STORAGE_KEY,json)}catch{}},
 scanReceipt(){if(window.BudgetAppAndroid&&typeof window.BudgetAppAndroid.scanReceipt==='function'){window.BudgetAppAndroid.scanReceipt();return}toast('Android-functie','Bon scannen gebruikt straks de lokale Android-camera en OCR.')},
 importPdf(){if(window.BudgetAppAndroid&&typeof window.BudgetAppAndroid.importPdf==='function'){window.BudgetAppAndroid.importPdf();return}toast('Android-functie','PDF-import gebruikt straks de lokale Android-bestandskiezer en OCR.')}
};
function id(){return globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
let state=platform.load()||seed();
function save(){platform.save(state)}
const euro=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(Number(n)||0);
const num=v=>Number(String(v).replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''))||0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function salaryPeriod(date=new Date(),salaryDay=23){const y=date.getFullYear(),m=date.getMonth(),d=date.getDate();let start,end;if(d>=salaryDay){start=new Date(y,m,salaryDay);end=new Date(y,m+1,salaryDay-1)}else{start=new Date(y,m-1,salaryDay);end=new Date(y,m,salaryDay-1)}start.setHours(0,0,0,0);end.setHours(23,59,59,999);const today=new Date(y,m,d);today.setHours(0,0,0,0);return{start,end,days:Math.max(0,Math.ceil((end-today)/86400000))}}
function shortDate(d){return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}).replace('.','')}
function salaryLabel(){const p=salaryPeriod(),remain=p.days===0?'laatste dag':`nog ${p.days} dag${p.days===1?'':'en'}`;return`${shortDate(p.start)} – ${shortDate(p.end)} · ${remain}`}
function periodLabel(p){return p==='week'?'p/w':p==='salary'?'p/periode':p==='year'?'p/jaar':'eenmalig'}
function rangeFor(p){const now=new Date(),start=new Date(now),end=new Date(now);start.setHours(0,0,0,0);end.setHours(23,59,59,999);if(p==='week'){const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);end.setTime(start.getTime());end.setDate(end.getDate()+6);end.setHours(23,59,59,999)}else if(p==='salary'){const s=salaryPeriod(now);return[s.start.getTime(),s.end.getTime()]}else if(p==='year'){start.setMonth(0,1);end.setMonth(11,31)}else return[0,Number.MAX_SAFE_INTEGER];return[start.getTime(),end.getTime()]}
function potSpend(p){const[a,b]=rangeFor(p.period);return state.transactions.filter(t=>t.potId===p.id&&!t.excludeFromPots&&t.amount<0&&t.time>=a&&t.time<=b).reduce((s,t)=>s+Math.abs(t.amount),0)}
function balance(){return state.knownBalance===null?state.transactions.filter(t=>t.affectsBalance!==false).reduce((s,t)=>s+t.amount,0):state.knownBalance}
function monthTotals(){const n=new Date(),a=new Date(n.getFullYear(),n.getMonth(),1).getTime(),b=new Date(n.getFullYear(),n.getMonth()+1,1).getTime()-1;let inc=0,out=0;state.transactions.filter(t=>t.time>=a&&t.time<=b&&t.affectsBalance!==false).forEach(t=>t.amount>=0?inc+=t.amount:out+=Math.abs(t.amount));return{inc,out}}
function recentSaving(){const cutoff=Date.now()-90*86400000;return Math.max(0,state.transactions.filter(t=>t.time>=cutoff&&t.affectsBalance!==false).reduce((s,t)=>s+t.amount,0)/3)}
function showScreen(id,nav){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(nav)?.classList.add('active');render();scrollTo({top:0,behavior:'smooth'})}
function render(){renderHome();renderBudgets();renderTransactions();renderOverview()}
function renderHome(){const el=document.getElementById('home'),m=monthTotals(),g=state.goal,left=Math.max(0,g.target-g.current),trend=g.monthly>0?g.monthly:recentSaving(),months=left===0?'Doel bereikt':trend>0?`± ${Math.ceil(left/trend)} maanden`:'Geen schatting',pct=g.target>0?Math.min(100,g.current/g.target*100):0;let html=`<div class="section card balance"><div class="eyebrow">Totaal saldo</div><div class="big">${euro(balance())}</div><div class="grid2"><div class="mini"><small>Inkomsten deze maand</small><strong class="pos">+ ${euro(m.inc)}</strong></div><div class="mini"><small>Uitgaven deze maand</small><strong class="neg">- ${euro(m.out)}</strong></div></div></div><div class="section card goal"><div class="row"><div><div class="title">${esc(g.name)}</div><div class="sub">Zo snel mogelijk naar ${euro(g.target)}</div></div><button class="link" onclick="editGoal()">Aanpassen</button></div><div class="bar"><span style="width:${pct}%"></span></div><div class="goalfoot"><span>${euro(g.current)}</span><span>${euro(left)} te gaan</span></div><div class="goalestimate"><span>Geschatte tijd bij huidige spaarinleg</span><strong>${months}</strong></div></div><div class="section"><button class="cta" onclick="openSpend()">Wat wil je uitgeven?<small>Controleer vooraf of het binnen je budget past</small></button></div><div class="head"><div class="title">Budgetpotjes</div><button class="link" onclick="showScreen('budgets','nbudget')">Alles bekijken</button></div><div class="periodbanner"><span>Salarisperiode</span><strong>${salaryLabel()}</strong></div><div class="pots">`;
 const active=state.pots.filter(p=>p.active);active.forEach((p,i)=>{const spent=potSpend(p),remaining=p.budget-spent,used=p.budget>0?Math.min(100,spent/p.budget*100):0;html+=`<div class="card pot ${i===active.length-1&&active.length%2===1?'wide':''}" onclick="editPot('${p.id}')"><div><div class="potname">${esc(p.name)}<span class="period">${periodLabel(p.period)}</span></div><div class="left" ${remaining<0?'style="color:var(--red)"':''}>${euro(remaining)}</div></div><div><div class="meta">${euro(spent)} van ${euro(p.budget)} gebruikt${remaining<0?' · budget overschreden':''}</div><div class="meter"><span style="width:${used}%;${remaining<0?'background:var(--red)':''}"></span></div><div class="salaryperiod"><span>${p.period==='salary'?salaryLabel().split(' · ')[0]:p.period==='week'?'Reset maandag':'Budgetperiode'}</span><strong>${p.period==='salary'?salaryLabel().split(' · ')[1]:periodLabel(p.period)}</strong></div></div></div>`});html+='</div>';
 const unknown=state.transactions.filter(t=>!t.category&&t.amount<0);if(unknown.length)html+=`<div class="section card alert" onclick="showUncategorized()"><div class="dot"></div><div class="grow"><strong>${unknown.length} transactie${unknown.length===1?'':'s'} nog indelen</strong><small>Tik om een onderwerp te kiezen</small></div><div class="badge">${unknown.length}</div></div>`;
 html+=`<div class="head"><div class="title">Laatste transacties</div><button class="link" onclick="showScreen('transactions','ntx')">Alles</button></div>${txList(state.transactions.slice().sort((a,b)=>b.time-a.time).slice(0,4))}<div class="head"><div class="title">Snel toevoegen</div></div><div class="quick"><button onclick="platform.scanReceipt()"><b>▣</b>Bon scannen</button><button onclick="platform.importPdf()"><b>PDF</b>PDF importeren</button><button onclick="editTransaction()"><b>＋</b>Handmatig</button></div>`;el.innerHTML=html}
function renderBudgets(){const el=document.getElementById('budgets');let html=`<div class="head"><div class="title">Budgetten & potjes</div><button class="link" onclick="editPot()">Nieuw potje</button></div><div class="periodbanner"><span>Huidige salarisperiode</span><strong>${salaryLabel()}</strong></div><div class="card list">`;state.pots.forEach(p=>{html+=`<div class="setrow" onclick="editPot('${p.id}')"><div><strong>${esc(p.name)}</strong><small>${euro(p.budget)} ${periodLabel(p.period)}${p.period==='salary'?' · 23e t/m 22e':''}</small></div><div class="value">${euro(p.budget)}</div></div>`});html+=`</div><div class="head"><div class="title">Vaste lasten</div><button class="link" onclick="editFixed()">Toevoegen</button></div><div class="card list">`;if(!state.fixedCosts.length)html+='<div class="empty">Nog geen vaste lasten ingevoerd.</div>';state.fixedCosts.forEach(f=>html+=`<div class="setrow" onclick="editFixed('${f.id}')"><div><strong>${esc(f.name)}</strong><small>${esc(f.periodLabel||'Maandelijks')}</small></div><div class="value">${euro(f.amount)}</div></div>`);html+='</div>';el.innerHTML=html}
function txList(list){if(!list.length)return'<div class="card empty">Nog geen transacties.</div>';return`<div class="card txlist">${list.map(t=>`<div class="tx ${!t.category&&t.amount<0?'unknown':''}" onclick="txDetail('${t.id}')"><div class="txicon">${esc((t.merchant||t.description||'?').trim().slice(0,2).toUpperCase())}</div><div><div class="txname">${esc(t.merchant||t.description||'Transactie')}</div><div class="txsub">${new Date(t.time).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})} · ${esc(t.category||'Nog indelen')}</div></div><div class="txamt ${t.amount>=0?'pos':'neg'}">${t.amount>=0?'+ ':''}${euro(t.amount)}</div></div>`).join('')}</div>`}
function renderTransactions(){const list=state.transactions.slice().sort((a,b)=>b.time-a.time);document.getElementById('transactions').innerHTML=`<div class="head"><div class="title">Transacties</div><button class="link" onclick="editTransaction()">Toevoegen</button></div>${txList(list)}`}
function renderOverview(){const m=monthTotals();const buckets={};state.transactions.filter(t=>t.amount<0&&t.category).forEach(t=>buckets[t.category]=(buckets[t.category]||0)+Math.abs(t.amount));const total=Object.values(buckets).reduce((a,b)=>a+b,0);let rows=Object.entries(buckets).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="setrow"><div><strong>${esc(k)}</strong><small>${total?Math.round(v/total*100):0}%</small></div><div class="value">${euro(v)}</div></div>`).join('');if(!rows)rows='<div class="empty">Nog geen gecategoriseerde uitgaven.</div>';document.getElementById('overview').innerHTML=`<div class="head"><div class="title">Overzicht</div></div><div class="card balance"><div class="eyebrow">Deze maand</div><div class="big" style="font-size:31px">${m.inc-m.out>=0?'+ ':''}${euro(m.inc-m.out)}</div><div class="grid2"><div class="mini"><small>Inkomsten</small><strong class="pos">${euro(m.inc)}</strong></div><div class="mini"><small>Uitgaven</small><strong class="neg">${euro(m.out)}</strong></div></div></div><div class="head"><div class="title">Uitgaven per onderwerp</div></div><div class="card list">${rows}</div>`}
function openSheet(title,body){document.getElementById('sheetTitle').textContent=title;document.getElementById('sheetBody').innerHTML=body;document.getElementById('sheet').classList.add('open')}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function field(id,label,value='',type='text'){return`<div class="field"><label>${label}</label><input id="${id}" class="input" type="${type}" value="${esc(value)}"></div>`}
function editGoal(){const g=state.goal;openSheet('Spaardoel aanpassen',`${field('goalTarget','Doelbedrag',g.target)}${field('goalCurrent','Huidige stand',g.current)}${field('goalMonthly','Maandelijkse doelinleg',g.monthly||'')}<button class="primary" onclick="saveGoal()">Opslaan</button>`)}
function saveGoal(){state.goal.target=Math.max(0,num(document.getElementById('goalTarget').value));state.goal.current=Math.max(0,num(document.getElementById('goalCurrent').value));state.goal.monthly=Math.max(0,num(document.getElementById('goalMonthly').value));save();closeSheet();render()}
function editPot(pid){const p=state.pots.find(x=>x.id===pid)||{id:null,name:'',budget:'',period:'week',active:true};openSheet(p.id?'Budgetpotje aanpassen':'Nieuw budgetpotje',`${field('potName','Naam',p.name)}${field('potBudget','Budget',p.budget)}<div class="field"><label>Periode</label><select id="potPeriod" class="select"><option value="week" ${p.period==='week'?'selected':''}>Per week</option><option value="salary" ${p.period==='salary'?'selected':''}>Per salarisperiode</option><option value="year" ${p.period==='year'?'selected':''}>Per jaar</option><option value="once" ${p.period==='once'?'selected':''}>Eenmalig</option></select></div><button class="primary" onclick="savePot('${p.id||''}')">Opslaan</button>${p.id?'<button class="ghost danger" onclick="deletePot(\''+p.id+'\')">Verwijderen</button>':''}`)}
function savePot(pid){let p=state.pots.find(x=>x.id===pid);if(!p){p={id:id(),active:true};state.pots.push(p)}p.name=document.getElementById('potName').value.trim()||'Budgetpotje';p.budget=Math.max(0,num(document.getElementById('potBudget').value));p.period=document.getElementById('potPeriod').value;save();closeSheet();render()}
function deletePot(pid){state.pots=state.pots.filter(p=>p.id!==pid);state.transactions.forEach(t=>{if(t.potId===pid)t.potId=null});save();closeSheet();render()}
function editFixed(fid){const f=state.fixedCosts.find(x=>x.id===fid)||{id:null,name:'',amount:'',periodLabel:'Maandelijks'};openSheet(f.id?'Vaste last aanpassen':'Vaste last toevoegen',`${field('fixedName','Naam',f.name)}${field('fixedAmount','Bedrag',f.amount)}<div class="field"><label>Frequentie</label><select id="fixedPeriod" class="select"><option ${f.periodLabel==='Maandelijks'?'selected':''}>Maandelijks</option><option ${f.periodLabel==='Wekelijks'?'selected':''}>Wekelijks</option><option ${f.periodLabel==='Jaarlijks'?'selected':''}>Jaarlijks</option><option ${f.periodLabel==='Tijdelijk'?'selected':''}>Tijdelijk</option></select></div><button class="primary" onclick="saveFixed('${f.id||''}')">Opslaan</button>${f.id?'<button class="ghost danger" onclick="deleteFixed(\''+f.id+'\')">Verwijderen</button>':''}`)}
function saveFixed(fid){let f=state.fixedCosts.find(x=>x.id===fid);if(!f){f={id:id()};state.fixedCosts.push(f)}f.name=document.getElementById('fixedName').value.trim()||'Vaste last';f.amount=Math.max(0,num(document.getElementById('fixedAmount').value));f.periodLabel=document.getElementById('fixedPeriod').value;save();closeSheet();render()}
function deleteFixed(fid){state.fixedCosts=state.fixedCosts.filter(f=>f.id!==fid);save();closeSheet();render()}
function editTransaction(tid){const t=state.transactions.find(x=>x.id===tid)||{id:null,type:'expense',merchant:'',amount:'',category:'',potId:''};const options=state.pots.map(p=>`<option value="${p.id}" ${t.potId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');openSheet(t.id?'Transactie aanpassen':'Handmatige transactie',`<div class="field"><label>Type</label><select id="txType" class="select"><option value="expense" ${t.amount<0?'selected':''}>Uitgave</option><option value="income" ${t.amount>=0&&t.id?'selected':''}>Inkomst</option></select></div>${field('txMerchant','Omschrijving',t.merchant||t.description||'')}${field('txAmount','Bedrag',Math.abs(t.amount||0))}${field('txCategory','Categorie',t.category||'')}<div class="field"><label>Budgetpotje</label><select id="txPot" class="select"><option value="">Geen potje</option>${options}</select></div><button class="primary" onclick="saveTransaction('${t.id||''}')">Opslaan</button>${t.id?'<button class="ghost danger" onclick="deleteTransaction(\''+t.id+'\')">Verwijderen</button>':''}`)}
function saveTransaction(tid){let t=state.transactions.find(x=>x.id===tid);if(!t){t={id:id(),time:Date.now(),source:'Handmatig',affectsBalance:true};state.transactions.push(t)}const type=document.getElementById('txType').value,amount=Math.abs(num(document.getElementById('txAmount').value));t.merchant=document.getElementById('txMerchant').value.trim();t.description=t.merchant;t.amount=type==='expense'?-amount:amount;t.category=document.getElementById('txCategory').value.trim();t.potId=document.getElementById('txPot').value||null;save();closeSheet();render()}
function deleteTransaction(tid){state.transactions=state.transactions.filter(t=>t.id!==tid);save();closeSheet();render()}
function txDetail(tid){const t=state.transactions.find(x=>x.id===tid);if(!t)return;let body='<div class="detail">';[['Bedrag',euro(t.amount)],['Categorie',t.category],['Datum',new Date(t.time).toLocaleDateString('nl-NL')],['Tijd',new Date(t.time).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})],['Bron',t.source]].forEach(([k,v])=>{if(v)body+=`<div class="drow"><span>${k}</span><span>${esc(v)}</span></div>`});body+=`</div><button class="ghost" onclick="editTransaction('${t.id}')">Bewerken</button>`;if(!t.category&&t.amount<0)body+=`<button class="primary" onclick="categorize('${t.id}')">Indelen</button>`;openSheet(t.merchant||t.description||'Transactie',body)}
function categorize(tid){const t=state.transactions.find(x=>x.id===tid);const cats=['Boodschappen','Vrije uitgaven','Brandstof','Auto / motor','Elektronica','Games / hobby','Huishouden','Anders'];openSheet('Transactie indelen',`<div class="mini"><strong>${esc(t.merchant||t.description||'Transactie')}</strong><small>${euro(Math.abs(t.amount))}</small></div><div class="field"><label>Onderwerp</label><div class="cats">${cats.map(c=>`<button class="cat" onclick="saveCategory('${tid}','${c.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div></div>`)}
function saveCategory(tid,category){const t=state.transactions.find(x=>x.id===tid);if(!t)return;t.category=category;const match=state.pots.find(p=>p.name===category);if(match)t.potId=match.id;if(t.merchant)state.rules[t.merchant.toLowerCase()]=category;save();closeSheet();render()}
function showUncategorized(){const list=state.transactions.filter(t=>!t.category&&t.amount<0);openSheet('Nog indelen',`<div class="card txlist">${list.map(t=>`<div class="tx unknown" onclick="categorize('${t.id}')"><div class="txicon">?</div><div><div class="txname">${esc(t.merchant||t.description||'Onbekend')}</div><div class="txsub">${euro(Math.abs(t.amount))}</div></div><div class="badge">Kies</div></div>`).join('')}</div>`)}
function openSpend(){const cats=state.pots.filter(p=>p.active);openSheet('Wat wil je uitgeven?',`<div class="field"><label>Onderwerp</label><select id="spendPot" class="select">${cats.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>${field('spendAmount','Bedrag','')}<button class="primary" onclick="checkSpend()">Controleren</button><div id="spendResult"></div>`)}
function checkSpend(){const p=state.pots.find(x=>x.id===document.getElementById('spendPot').value),a=Math.abs(num(document.getElementById('spendAmount').value)),r=document.getElementById('spendResult');if(!p||!a){r.innerHTML='<div class="result show no"><strong>Vul eerst een bedrag in</strong></div>';return}const remaining=p.budget-potSpend(p),after=remaining-a;if(after>=0)r.innerHTML=`<div class="result show ok"><strong>Kan binnen je budget</strong><small>Na ${euro(a)} blijft in ${esc(p.name)} ${euro(after)} over.</small></div>`;else r.innerHTML=`<div class="result show warn"><strong>Budget wordt overschreden</strong><small>Dit is ${euro(Math.abs(after))} meer dan er in ${esc(p.name)} over is.</small></div>`}
function openSettings(){openSheet('Instellingen',`<div class="card list" style="margin-top:12px"><div class="setrow"><div><strong>Financiële periode</strong><small>Van salaris tot salaris</small></div><div class="value">23e → 22e</div></div><div class="setrow"><div><strong>Weekbudget reset</strong><small>Vrije uitgaven</small></div><div class="value">Maandag</div></div><div class="setrow"><div><strong>Lokale opslag</strong><small>Android lokaal · browser alleen preview</small></div><div class="pos">Actief</div></div><div class="setrow"><div><strong>Notificatieherkenning</strong><small>Rabobank + Wallet</small></div><div class="value">Android</div></div></div>`)}
function toast(t,x){document.getElementById('toasttitle').textContent=t;document.getElementById('toasttext').textContent=x;const e=document.getElementById('toast');e.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('show'),3500)}
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
window.BudgetAppWeb={setState(json){try{state=typeof json==='string'?JSON.parse(json):json;save();render()}catch{}},getState(){return JSON.stringify(state)}};
render();
</script>
</body>
</html>
