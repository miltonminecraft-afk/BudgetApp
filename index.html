<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>BudgetApp</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#161b22;--panel2:#1f2630;--text:#f0f6fc;--muted:#8b949e;--accent:#56d364;--danger:#ff7b72;--line:#30363d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{min-height:100dvh;padding-bottom:76px}.topbar{position:sticky;top:0;z-index:10;background:rgba(11,13,16,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-left)) 12px}.brand{font-size:22px;font-weight:800}.subtitle{font-size:13px;color:var(--muted);margin-top:2px}.content{max-width:760px;margin:0 auto;padding:14px 14px 28px}.section{font-size:15px;font-weight:800;margin:18px 2px 8px}.card{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;text-align:left;color:var(--text)}button.card{cursor:pointer}.card-main{font-size:15px;font-weight:750;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.card-sub{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.35}.amount{white-space:nowrap}.positive{color:var(--accent)}.negative{color:var(--danger)}.action{width:100%;border:0;border-radius:12px;background:var(--accent);color:#071009;font-weight:800;padding:12px 14px;margin-bottom:10px;cursor:pointer}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:transparent;color:var(--danger);border:1px solid #633b3f}.empty{color:var(--muted);padding:18px 4px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;overflow-x:auto;background:rgba(22,27,34,.98);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));gap:4px}.nav button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);padding:10px 11px;border-radius:10px;cursor:pointer}.nav button.active{background:var(--panel2);color:var(--text);font-weight:800}.dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:0;width:min(92vw,520px);max-height:86dvh}.dialog::backdrop{background:rgba(0,0,0,.72)}.dialog-head{padding:17px 18px 7px;font-size:18px;font-weight:800}.dialog-body{padding:8px 18px 14px;overflow:auto;max-height:65dvh}.dialog-actions{display:flex;gap:8px;padding:10px 18px 18px}.dialog-actions button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:750;cursor:pointer}.field{margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.field input:focus,.field select:focus{border-color:var(--accent)}.check{display:flex;gap:9px;align-items:center;margin:9px 0;color:var(--text)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.progress{height:8px;background:#0d1117;border-radius:999px;overflow:hidden;margin-top:9px}.progress>span{display:block;height:100%;background:var(--accent);border-radius:999px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);font-size:11px;margin-top:7px}.notice{border-left:3px solid var(--accent)}@media(max-width:480px){.two{grid-template-columns:1fr}.content{padding-left:10px;padding-right:10px}.nav button{font-size:12px;padding-left:9px;padding-right:9px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand">BudgetApp</div><div class="subtitle" id="subtitle">Overzicht</div></header>
<main class="content" id="content"></main>
<nav class="nav" id="nav">
<button data-screen="overview">Overzicht</button>
<button data-screen="pots">Potjes</button>
<button data-screen="transactions">Transacties</button>
<button data-screen="import">Import</button>
<button data-screen="settings">Instellingen</button>
</nav>
</div>
<dialog class="dialog" id="dialog"><div class="dialog-head" id="dialogTitle"></div><div class="dialog-body" id="dialogBody"></div><div class="dialog-actions" id="dialogActions"></div></dialog>
<script>
const KEY='budgetAppStateV1';
const euro=new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'});
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const seed=()=>({pots:[{id:uid(),name:'Vrije uitgaven',budget:80,period:'week',active:true,hidden:false},{id:uid(),name:'Boodschappen',budget:180,period:'salary',active:true,hidden:false},{id:uid(),name:'Brandstof',budget:60,period:'salary',active:true,hidden:false}],transactions:[],fixedCosts:[],goal:{name:'Spaardoel',current:0,target:30000},knownBalance:null,unknown:[]});
let state=load();
let screen='overview';
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY));return saved&&saved.pots?saved:seed()}catch{return seed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(v){return euro.format(Number(v)||0)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function periodLabel(p){return({week:'week',salary:'salarisperiode 23e–22e',month:'maand',year:'jaar',once:'eenmalig'})[p]||'maand'}
function rangeFor(period,now=new Date()){
 const start=new Date(now),end=new Date(now);start.setHours(0,0,0,0);end.setHours(23,59,59,999);
 if(period==='week'){const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);end.setTime(start.getTime());end.setDate(end.getDate()+6);end.setHours(23,59,59,999)}
 else if(period==='salary'){if(start.getDate()>=23){start.setDate(23);end.setFullYear(start.getFullYear(),start.getMonth()+1,22)}else{end.setDate(22);start.setFullYear(start.getFullYear(),start.getMonth()-1,23)}}
 else if(period==='year'){start.setMonth(0,1);end.setMonth(11,31)}
 else if(period==='once'){return[0,Number.MAX_SAFE_INTEGER]}
 else{start.setDate(1);end.setFullYear(start.getFullYear(),start.getMonth()+1,0)}
 return[start.getTime(),end.getTime()]
}
function potSpend(pot){const[a,b]=rangeFor(pot.period);return state.transactions.filter(t=>t.potId===pot.id&&!t.excludeFromPots&&t.amount<0&&t.time>=a&&t.time<=b).reduce((s,t)=>s+Math.abs(t.amount),0)}
function calculatedBalance(){return state.transactions.filter(t=>t.affectsBalance!==false).reduce((s,t)=>s+t.amount,0)}
function setScreen(name){screen=name;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));render()}
function render(){document.getElementById('subtitle').textContent=({overview:'Overzicht',pots:'Potjes',transactions:'Transacties',import:'Import',settings:'Instellingen'})[screen];({overview:renderOverview,pots:renderPots,transactions:renderTransactions,import:renderImport,settings:renderSettings})[screen]()}
function card(main,sub='',cls=''){return`<div class="card ${cls}"><div class="card-main">${main}</div>${sub?`<div class="card-sub">${sub}</div>`:''}</div>`}
function renderOverview(){
 const c=document.getElementById('content');const balance=state.knownBalance??calculatedBalance();let html='<div class="section">Saldo</div>'+card(`<span>${state.knownBalance===null?'Berekend saldo':'Bekend banksaldo'}</span><span class="amount">${money(balance)}</span>`,state.knownBalance===null?'Som van geregistreerde transacties':'Laatste gevalideerde saldo');
 html+='<div class="section">Potjes nu</div>';
 state.pots.filter(p=>p.active&&!p.hidden).forEach(p=>{const spent=potSpend(p),left=p.budget-spent;html+=`<button class="card" data-pot="${p.id}"><div class="card-main"><span>${esc(p.name)}</span><span class="amount ${left<0?'negative':''}">${money(left)} over</span></div><div class="card-sub">${money(spent)} gebruikt van ${money(p.budget)} per ${periodLabel(p.period)}</div></button>`});
 const g=state.goal,left=Math.max(0,g.target-g.current);const recent=monthlyTrend();let eta=left===0?'Doel bereikt':recent>0?`Geschat ${Math.ceil(left/recent)} maanden bij ${money(recent)} netto per maand`:'Nog geen positieve spaartrend om een schatting te maken';const pct=g.target>0?Math.min(100,g.current/g.target*100):0;
 html+='<div class="section">Spaardoel</div>'+`<button class="card" id="goalCard"><div class="card-main"><span>${esc(g.name)}</span><span class="amount">${money(g.current)} / ${money(g.target)}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="card-sub">${money(left)} resterend · ${eta}</div></button>`;
 c.innerHTML=html;c.querySelectorAll('[data-pot]').forEach(b=>b.onclick=()=>editPot(b.dataset.pot));document.getElementById('goalCard').onclick=editGoal
}
function monthlyTrend(){const cutoff=Date.now()-90*86400000;const net=state.transactions.filter(t=>t.affectsBalance!==false&&t.time>=cutoff).reduce((s,t)=>s+t.amount,0);return Math.max(0,net/3)}
function renderPots(){const c=document.getElementById('content');let html='<button class="action" id="addPot">+ Potje toevoegen</button>';if(!state.pots.length)html+='<div class="empty">Nog geen potjes.</div>';state.pots.forEach(p=>{const spent=potSpend(p),left=p.budget-spent;html+=`<button class="card" data-pot="${p.id}"><div class="card-main"><span>${p.active?'':'Inactief · '}${esc(p.name)}</span><span class="amount ${left<0?'negative':''}">${money(left)}</span></div><div class="card-sub">${money(p.budget)} per ${periodLabel(p.period)} · ${money(spent)} gebruikt</div></button>`});c.innerHTML=html;document.getElementById('addPot').onclick=()=>editPot();c.querySelectorAll('[data-pot]').forEach(b=>b.onclick=()=>editPot(b.dataset.pot))}
function renderTransactions(){const c=document.getElementById('content');let html='<button class="action" id="addTx">+ Handmatig toevoegen</button>';const list=[...state.transactions].sort((a,b)=>b.time-a.time);if(!list.length)html+='<div class="empty">Nog geen transacties.</div>';list.forEach(t=>{const name=t.merchant||t.description||'Transactie';html+=`<button class="card" data-tx="${t.id}"><div class="card-main"><span>${esc(name)}</span><span class="amount ${t.amount>=0?'positive':'negative'}">${money(t.amount)}</span></div><div class="card-sub">${new Date(t.time).toLocaleString('nl-NL')} · ${esc(t.source||'Handmatig')}${t.category?` · ${esc(t.category)}`:''}</div></button>`});c.innerHTML=html;document.getElementById('addTx').onclick=()=>editTransaction();c.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>transactionDetails(b.dataset.tx))}
function renderImport(){const c=document.getElementById('content');c.innerHTML=`<div class="section">Bank</div>${card('<span>PDF-bankafschrift</span>','De webadapter voor lokale PDF-OCR wordt aan dezelfde importlogica gekoppeld.','notice')}<button class="action secondary" id="backupImport">Lokale backup importeren</button><input id="backupFile" type="file" accept="application/json" hidden><div class="section">Bonnen</div>${card('<span>Bon scannen</span>','De camera/OCR-adapter wordt platformafhankelijk gekoppeld zonder de budgetlogica te dupliceren.','notice')}<div class="section">Live betaalmeldingen</div>${card('<span>Rabobank / Google Wallet</span>','Live Android-notificaties worden via de Android-adapter verwerkt. In de webversie blijft de rest van de app volledig testbaar.','notice')}<div class="section">Nog te categoriseren</div>${state.unknown.length?state.unknown.map(x=>card(`<span>${esc(x.name)}</span><span>${money(x.amount)}</span>`,'Tikfunctionaliteit volgt met de importadapter.')).join(''):'<div class="empty">Alles gecategoriseerd.</div>'}`;document.getElementById('backupImport').onclick=()=>document.getElementById('backupFile').click();document.getElementById('backupFile').onchange=importBackup}
function renderSettings(){const c=document.getElementById('content');let html='<div class="section">Vaste lasten</div><button class="action" id="addFixed">+ Vaste last toevoegen</button>';if(!state.fixedCosts.length)html+='<div class="empty">Nog geen vaste lasten ingevoerd.</div>';state.fixedCosts.forEach(f=>html+=`<button class="card" data-fixed="${f.id}"><div class="card-main"><span>${esc(f.name)}</span><span>${money(f.amount)}</span></div><div class="card-sub">${periodLabel(f.period)}${f.annual?' · jaarlijkse heffing':''}</div></button>`);html+='<div class="section">Spaardoel</div>'+`<button class="card" id="settingsGoal"><div class="card-main"><span>${esc(state.goal.name)}</span><span>${money(state.goal.current)} / ${money(state.goal.target)}</span></div></button>`;html+='<div class="section">Data</div><button class="action secondary" id="exportData">Backup exporteren</button><button class="action danger" id="resetData">Alle lokale data wissen</button>';c.innerHTML=html;document.getElementById('addFixed').onclick=()=>editFixed();c.querySelectorAll('[data-fixed]').forEach(b=>b.onclick=()=>editFixed(b.dataset.fixed));document.getElementById('settingsGoal').onclick=editGoal;document.getElementById('exportData').onclick=exportBackup;document.getElementById('resetData').onclick=resetData}
function openDialog(title,body,buttons){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').innerHTML=body;const actions=document.getElementById('dialogActions');actions.innerHTML='';buttons.forEach(b=>{const el=document.createElement('button');el.textContent=b.label;el.className=b.class||'';el.onclick=b.action;actions.appendChild(el)});document.getElementById('dialog').showModal()}
function closeDialog(){document.getElementById('dialog').close()}
function field(id,label,value='',type='text'){return`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}
function editPot(id){const existing=state.pots.find(p=>p.id===id),p=existing||{id:uid(),name:'',budget:0,period:'month',active:true,hidden:false};const body=field('potName','Naam',p.name)+field('potBudget','Budget',String(p.budget).replace('.',','),'text')+`<div class="field"><label>Periode</label><select id="potPeriod"><option value="week">Week</option><option value="salary">Salarisperiode 23e–22e</option><option value="month">Maand</option><option value="year">Jaar</option><option value="once">Eenmalig</option></select></div><label class="check"><input id="potActive" type="checkbox" ${p.active?'checked':''}> Actief</label><label class="check"><input id="potHidden" type="checkbox" ${p.hidden?'checked':''}> Verbergen in overzicht</label>`;const buttons=[{label:'Annuleren',action:closeDialog},{label:'Opslaan',action:()=>{p.name=document.getElementById('potName').value.trim();p.budget=parseAmount(document.getElementById('potBudget').value);p.period=document.getElementById('potPeriod').value;p.active=document.getElementById('potActive').checked;p.hidden=document.getElementById('potHidden').checked;if(!p.name)return;if(existing)Object.assign(existing,p);else state.pots.push(p);save();closeDialog();render()}}];if(existing)buttons.unshift({label:'Verwijderen',class:'danger',action:()=>{if(confirm('Potje verwijderen?')){state.pots=state.pots.filter(x=>x.id!==id);state.transactions.forEach(t=>{if(t.potId===id)t.potId=null});save();closeDialog();render()}}});openDialog(existing?'Potje aanpassen':'Potje toevoegen',body,buttons);document.getElementById('potPeriod').value=p.period}
function editTransaction(id){const existing=state.transactions.find(t=>t.id===id),t=existing||{id:uid(),amount:0,merchant:'',description:'',category:'',potId:null,time:Date.now(),source:'Handmatig',affectsBalance:true,excludeFromPots:false};const options='<option value="">Geen potje</option>'+state.pots.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');const body=field('txAmount','Bedrag, uitgave negatief',String(t.amount).replace('.',','))+field('txMerchant','Merchant / naam',t.merchant)+field('txDescription','Omschrijving',t.description)+field('txCategory','Categorie',t.category)+`<div class="field"><label>Potje</label><select id="txPot">${options}</select></div>`;const buttons=[{label:'Annuleren',action:closeDialog},{label:'Opslaan',action:()=>{t.amount=parseSigned(document.getElementById('txAmount').value);t.merchant=document.getElementById('txMerchant').value.trim();t.description=document.getElementById('txDescription').value.trim();t.category=document.getElementById('txCategory').value.trim();t.potId=document.getElementById('txPot').value||null;if(existing)Object.assign(existing,t);else state.transactions.push(t);save();closeDialog();render()}}];if(existing)buttons.unshift({label:'Verwijderen',class:'danger',action:()=>{if(confirm('Transactie verwijderen?')){state.transactions=state.transactions.filter(x=>x.id!==id);save();closeDialog();render()}}});openDialog(existing?'Transactie aanpassen':'Handmatige transactie',body,buttons);document.getElementById('txPot').value=t.potId||''}
function transactionDetails(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;const rows=[['Bedrag',money(t.amount)],['Naam',t.merchant],['Omschrijving',t.description],['Categorie',t.category],['Bron',t.source],['Datum',new Date(t.time).toLocaleString('nl-NL')]].filter(r=>r[1]);openDialog(t.merchant||'Transactie',rows.map(r=>card(`<span>${esc(r[0])}</span>`,esc(r[1]))).join(''),[{label:'Sluiten',action:closeDialog},{label:'Bewerken',action:()=>{closeDialog();editTransaction(id)}}])}
function editGoal(){const g=state.goal;openDialog('Spaardoel aanpassen',field('goalName','Naam',g.name)+field('goalCurrent','Nu gespaard',String(g.current).replace('.',','))+field('goalTarget','Doel',String(g.target).replace('.',',')),[{label:'Annuleren',action:closeDialog},{label:'Opslaan',action:()=>{g.name=document.getElementById('goalName').value.trim()||'Spaardoel';g.current=parseAmount(document.getElementById('goalCurrent').value);g.target=parseAmount(document.getElementById('goalTarget').value);save();closeDialog();render()}}])}
function editFixed(id){const existing=state.fixedCosts.find(f=>f.id===id),f=existing||{id:uid(),name:'',amount:0,period:'month',dueDay:1,active:true,annual:false};const body=field('fixedName','Naam',f.name)+field('fixedAmount','Bedrag',String(f.amount).replace('.',','))+`<div class="two"><div class="field"><label>Periode</label><select id="fixedPeriod"><option value="week">Week</option><option value="salary">Salarisperiode 23e–22e</option><option value="month">Maand</option><option value="year">Jaar</option><option value="once">Eenmalig</option></select></div>${field('fixedDue','Vervaldag',f.dueDay,'number')}</div><label class="check"><input id="fixedActive" type="checkbox" ${f.active?'checked':''}> Actief</label><label class="check"><input id="fixedAnnual" type="checkbox" ${f.annual?'checked':''}> Jaarlijkse heffing</label>`;const buttons=[{label:'Annuleren',action:closeDialog},{label:'Opslaan',action:()=>{f.name=document.getElementById('fixedName').value.trim();f.amount=parseAmount(document.getElementById('fixedAmount').value);f.period=document.getElementById('fixedPeriod').value;f.dueDay=Math.max(1,Math.min(31,Number(document.getElementById('fixedDue').value)||1));f.active=document.getElementById('fixedActive').checked;f.annual=document.getElementById('fixedAnnual').checked;if(!f.name)return;if(existing)Object.assign(existing,f);else state.fixedCosts.push(f);save();closeDialog();render()}}];if(existing)buttons.unshift({label:'Verwijderen',class:'danger',action:()=>{if(confirm('Vaste last verwijderen?')){state.fixedCosts=state.fixedCosts.filter(x=>x.id!==id);save();closeDialog();render()}}});openDialog(existing?'Vaste last aanpassen':'Vaste last toevoegen',body,buttons);document.getElementById('fixedPeriod').value=f.period}
function parseAmount(v){return Math.abs(Number(String(v).replace(/\./g,'').replace(',','.').replace(/[^0-9.\-]/g,''))||0)}
function parseSigned(v){const raw=String(v).trim(),negative=raw.startsWith('-');const n=parseAmount(raw);return negative?-n:n}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`BudgetApp-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(e){const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.pots||!data.transactions)throw new Error();if(confirm('Huidige lokale data vervangen door deze backup?')){state=data;save();render()}}catch{alert('Ongeldige BudgetApp-backup.')}};r.readAsText(file);e.target.value=''}
function resetData(){if(confirm('Alle lokale BudgetApp-data op dit apparaat wissen?')){state=seed();save();render()}}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setScreen(b.dataset.screen));
setScreen('overview');
</script>
</body>
</html>
